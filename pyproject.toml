[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmosaic"
version = "0.1.0"
description = "GNSS-aided fast orthomosaic generation (SfM-free)"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "pyyaml"
]

[project.scripts]
fastmosaic = "fastmosaic.cli:main"
